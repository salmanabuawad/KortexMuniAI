# MuniAI — Nginx site for muniai.kortexd.com
# Serves the built React app and reverse-proxies /api to the FastAPI backend.
# Internal services (PostgreSQL, Redis, Ollama, FastAPI :8000) stay on localhost.

server {
    listen 80;
    server_name muniai.kortexd.com;

    # Certbot writes ACME challenges here; everything else redirects to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name muniai.kortexd.com;

    # Managed by Certbot (see scripts/install.sh). For LAN-only deployments,
    # replace with an internal certificate — no internet dependency required.
    ssl_certificate     /etc/letsencrypt/live/muniai.kortexd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muniai.kortexd.com/privkey.pem;

    # Municipal documents can be large; the app-side cap is advisory — this is
    # the real upload-size limiter.
    client_max_body_size 250M;

    root /opt/muniai/frontend/dist;
    index index.html;

    # API reverse proxy (streaming/SSE friendly).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: disable buffering so chat tokens stream to the browser.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
