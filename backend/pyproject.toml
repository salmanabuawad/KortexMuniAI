[project]
name = "muniai-backend"
version = "0.1.0"
description = "MuniAI — private, local-first municipal AI platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "redis>=5.0",
    "celery>=5.4",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Document pipeline / OCR (Phase 1 later modules). Kept optional so the core
# API installs and runs without heavy native OCR dependencies.
documents = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "ocrmypdf>=16.0",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
